name: devdays-agent-student-workshop

# Network layout (no service publishes a port to the host):
#   agent_net  (internal)  agent, gateway, model-proxy
#   db_net     (internal)  db, gateway
#   egress_net (outbound)  model-proxy only, to reach api.openai.com
# The agent has no route to the database or the internet except through
# the gateway (read-only) and the model proxy (holds the OpenAI key).

x-hardened: &hardened
  privileged: false
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true
  ipc: private
  cgroup: private

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: agent_lab
      POSTGRES_USER: lab_admin
      POSTGRES_PASSWORD: student-demo
    networks:
      - db_net
    volumes:
      - student_agent_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db-permissions.sql:/docker-entrypoint-initdb.d/02-permissions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_admin -d agent_lab"]
      interval: 2s
      timeout: 3s
      retries: 15

  gateway:
    <<: *hardened
    image: devdays-agent-gateway
    build:
      context: ./gateway
    user: "10002:10002"
    networks:
      - agent_net
      - db_net
    volumes:
      - ./gateway/connection.json:/run/gateway/connection.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy

  model-proxy:
    <<: *hardened
    image: devdays-agent-model-proxy
    build:
      context: ./model-proxy
    user: "10003:10003"
    networks:
      - agent_net
      - egress_net
    environment:
      # The real key lives only here, passed through from the host; never written in this file.
      OPENAI_API_KEY:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent:
    <<: *hardened
    image: devdays-agent-student
    build:
      context: .
    user: "10001:10001"
    networks:
      - agent_net
    tmpfs:
      - /tmp:mode=1777
      - /home/agent:uid=10001,gid=10001,mode=0700
    environment:
      GATEWAY_URL: http://gateway:8000
      OPENAI_BASE_URL: http://model-proxy:8080/v1
    # Only the agent entry point and the read-only credentials are exposed.
    # No project folder, host directories, Docker socket or SSH agent socket.
    volumes:
      - ./starter.py:/workspace/starter.py:ro
      - ./client.py:/workspace/client.py:ro
      - agent_credentials:/run/credentials/codex:ro
      - agent_identity:/run/identity:ro
    depends_on:
      gateway:
        condition: service_healthy
      model-proxy:
        condition: service_healthy

  # One-off: stores a placeholder Codex login in the credential volume.
  # The real key stays in model-proxy, which replaces it on every request.
  #   docker compose --profile setup run --rm codex-login
  codex-login:
    <<: *hardened
    image: devdays-agent-student
    profiles: ["setup"]
    user: "10001:10001"
    network_mode: none
    environment:
      CODEX_HOME: /run/credentials/codex
    volumes:
      - agent_credentials:/run/credentials/codex
    command: ["sh", "-c", "echo proxy-managed | codex login --with-api-key"]

  # One-off: issues the agent's gateway token (step 7). Stores only its hash in the
  # database and writes the token to the identity volume the agent mounts read-only.
  #   docker compose --profile setup run --rm identity-issuer
  identity-issuer:
    <<: *hardened
    image: devdays-agent-student
    profiles: ["setup"]
    user: "10001:10001"
    networks:
      - db_net
    environment:
      ADMIN_DATABASE_URL: postgresql://lab_admin:student-demo@db:5432/agent_lab
      TOKEN_ACTOR: workshop-agent
      TOKEN_COMPANY_ID: "1"
    volumes:
      - ./identity/issue_token.py:/app/issue_token.py:ro
      - agent_identity:/run/identity
    command: ["python", "/app/issue_token.py"]
    depends_on:
      db:
        condition: service_healthy

networks:
  agent_net:
    internal: true
  db_net:
    internal: true
  egress_net: {}

volumes:
  student_agent_data:
  agent_credentials:
  agent_identity:
