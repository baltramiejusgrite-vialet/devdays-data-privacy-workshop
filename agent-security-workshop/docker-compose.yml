name: devdays-agent-student-workshop

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: agent_lab
      POSTGRES_USER: lab_admin
      POSTGRES_PASSWORD: student-demo
    ports:
      - "127.0.0.1:15434:5432"
    volumes:
      - student_agent_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_admin -d agent_lab"]
      interval: 2s
      timeout: 3s
      retries: 15

  agent:
    image: devdays-agent-student
    build:
      context: .
    user: "10001:10001"
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql://lab_admin:student-demo@db:5432/agent_lab
      # Passed through from the host environment; the value is never written here.
      OPENAI_API_KEY:
    volumes:
      - .:/workspace
    depends_on:
      db:
        condition: service_healthy

volumes:
  student_agent_data:
