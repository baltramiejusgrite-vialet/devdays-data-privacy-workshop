name: devdays-agent-student-workshop

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: agent_lab
      POSTGRES_USER: lab_admin
      POSTGRES_PASSWORD: student-demo
    ports:
      - "127.0.0.1:15434:5432"
    volumes:
      - student_agent_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_admin -d agent_lab"]
      interval: 2s
      timeout: 3s
      retries: 15

  agent:
    image: devdays-agent-student
    build:
      context: .
    user: "10001:10001"
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    # Own namespaces only: never share the host's PID, IPC, UTS, user or cgroup namespaces.
    ipc: private
    cgroup: private
    tmpfs:
      - /tmp:mode=1777
      - /home/agent:uid=10001,gid=10001,mode=0700
    environment:
      DATABASE_URL: postgresql://lab_admin:student-demo@db:5432/agent_lab
      # Passed through from the host environment; the value is never written here.
      OPENAI_API_KEY:
    # Only the agent entry point and the read-only credentials are exposed.
    # No project folder, host directories, Docker socket or SSH agent socket.
    volumes:
      - ./starter.py:/workspace/starter.py:ro
      - agent_credentials:/run/credentials/codex:ro
    depends_on:
      db:
        condition: service_healthy

  # One-off: stores the Codex API key login in the credential volume.
  #   docker compose --profile setup run --rm codex-login
  codex-login:
    image: devdays-agent-student
    profiles: ["setup"]
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    environment:
      CODEX_HOME: /run/credentials/codex
      OPENAI_API_KEY:
    volumes:
      - agent_credentials:/run/credentials/codex
    command: ["sh", "-c", "printenv OPENAI_API_KEY | codex login --with-api-key"]

volumes:
  student_agent_data:
  agent_credentials:
