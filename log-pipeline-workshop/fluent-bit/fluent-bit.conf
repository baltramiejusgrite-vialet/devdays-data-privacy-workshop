# Exercises 2 and 3: Fluent Bit as the log processor and stream router.
#
#   raw.<service>        every tailed line (JSON parsed; malformed lines keep only "log")
#   forensic.<service>   an immediate, unmodified copy of every raw line -> forensic Loki
#   known.<service>      message matches the full known Lithuanian format -> Lua regex path
#   raw.<service>        anything else (unknown format, malformed JSON) -> log-presidio
#   sanitised.presidio   Presidio's sanitised result, posted back to the HTTP input
#
# Sanitised records (known.* and sanitised.*) go to the standard Loki; raw content only
# ever reaches the forensic Loki. Regex-path records also print on processor stdout.

[SERVICE]
    Flush             1
    Log_Level         warn
    Parsers_File      parsers.conf
    storage.path      /fluent-bit/state/buffer
    storage.sync      normal
    HTTP_Server       Off

[INPUT]
    Name              tail
    Path              /raw/hr/app.jsonl
    Tag               raw.hr
    Parser            json
    DB                /fluent-bit/state/tail-hr.db
    Read_from_Head    true
    storage.type      filesystem
    Refresh_Interval  1

[INPUT]
    Name              tail
    Path              /raw/billing/app.jsonl
    Tag               raw.billing
    Parser            json
    DB                /fluent-bit/state/tail-billing.db
    Read_from_Head    true
    storage.type      filesystem
    Refresh_Interval  1

[INPUT]
    Name              http
    Listen            0.0.0.0
    Port              9880
    Tag               sanitised.presidio

[FILTER]
    Name              record_modifier
    Match             raw.hr
    Record            service hr

[FILTER]
    Name              record_modifier
    Match             raw.billing
    Record            service billing

# Exercise 3: copy every raw record, before any processing, to the forensic store.
[FILTER]
    Name              rewrite_tag
    Match             raw.*
    Rule              $service ^.+$ forensic.$service true
    Emitter_Name      forensic_copy
    Emitter_Storage.type filesystem

# Known format: every field present, in order, with the expected value shapes.
[FILTER]
    Name              rewrite_tag
    Match             raw.*
    Rule              $message ^Anketa:\sdarbuotojas=[^;]+;\sasmens_kodas=\d{11};\stelefonas=[^;]+;\sadresas=[^;]+;\sel_pastas:\s[^;\s]+@[^;\s]+;\satlyginimas=\d+\sEUR;\s\S+=\S+$ known.$service false
    Emitter_Name      known_format
    Emitter_Storage.type filesystem

[FILTER]
    Name              lua
    Match             known.*
    Script            sanitise.lua
    Call              regex_path

[OUTPUT]
    Name              stdout
    Match             known.*
    Format            json_lines
    json_date_key     false

[OUTPUT]
    Name              http
    Match             raw.*
    Host              log-presidio
    Port              8000
    URI               /ingest
    Format            json
    json_date_key     false
    Retry_Limit       False
    storage.total_limit_size 200M

# Exercise 3: forensic store (raw, sensitive, 3-year retention, restricted Grafana).
[OUTPUT]
    Name              loki
    Match             forensic.*
    Host              loki-forensic
    Port              3100
    Labels            job=forensic, service=$service
    Line_Format       json
    Retry_Limit       False
    storage.total_limit_size 200M

# Exercise 3: standard store (sanitised only, 7-day retention).
[OUTPUT]
    Name              loki
    Match_Regex       ^(known|sanitised)\..*
    Host              loki
    Port              3100
    Labels            job=sanitised, service=$service, processing_path=$processing_path
    Line_Format       json
    Retry_Limit       False
    storage.total_limit_size 200M
